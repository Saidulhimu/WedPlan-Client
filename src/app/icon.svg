<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Luxurious Rounded Crest Background -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.6"/>
  
  <!-- Subtle Outer Stippled Ring -->
  <circle cx="32" cy="34" r="23" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="2 3" opacity="0.4"/>

  <!-- Interlocking Left Gold Wedding Ring -->
  <circle cx="25" cy="37" r="11" stroke="url(#goldGrad)" stroke-width="3.5" fill="none"/>
  
  <!-- Interlocking Right Platinum/White Wedding Ring -->
  <circle cx="39" cy="37" r="11" stroke="#FFFFFF" stroke-width="3.5" fill="none"/>

  <!-- Solitaire Diamond Peak at Apex -->
  <path d="M32 12L37 20L32 28L27 20Z" fill="url(#goldGrad)"/>
  <circle cx="32" cy="20" r="2.2" fill="#FFFFFF"/>
  <polygon points="32,16 34,20 32,24 30,20" fill="#FFFFFF" opacity="0.8"/>

  <!-- Gradients -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9E1B32"/>
      <stop offset="50%" stop-color="#800020"/>
      <stop offset="100%" stop-color="#54081c"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="16" y1="12" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>
</svg>
